    <title>Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .portfolio-container {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            grid-auto-rows: 150px;
        }

        .portfolio-item {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
        }

        .portfolio-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .portfolio-item:nth-child(2n) {
            grid-column: span 2;
            grid-row: span 2;
        }

        .portfolio-item:nth-child(3n) {
            grid-column: span 1;
            grid-row: span 2;
        }

        .portfolio-item:nth-child(5n) {
            grid-column: span 2;
            grid-row: span 1;
        }
    </style>
</head>
